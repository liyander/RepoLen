        const theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')

        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f5f8f6' : '#08100e'
      } catch { /* The React app applies the default theme if storage is unavailable. */ }
